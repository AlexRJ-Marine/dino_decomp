<text x="1097" y="272" font-size="15" font-weight="700" fill="#0f172a">BuildController</text>
<text x="1097" y="292" font-size="12" fill="#334155">fence/road/building/store</text>
<text x="1097" y="308" font-size="12" fill="#334155">validation, cost, commit;</text>
<text x="1097" y="324" font-size="12" fill="#334155">no drawing</text>
<rect x="1310" y="250" width="220" height="76" rx="8" fill="#ffedd5" stroke="#94a3b8"/>
<text x="1322" y="272" font-size="15" font-weight="700" fill="#0f172a">DinoSim + Animator</text>
<text x="1322" y="292" font-size="12" fill="#334155">import, needs, chooser,</text>
<text x="1322" y="308" font-size="12" fill="#334155">mover, clip sampling, skinning</text>
<text x="1322" y="324" font-size="12" fill="#334155">(P3-MOTION lands here)</text>
<rect x="860" y="355" width="205" height="70" rx="8" fill="#ede9fe" stroke="#94a3b8"/>

<text x="1097" y="397" font-size="12" fill="#334155">GL resources (RAII),</text>
<text x="1097" y="413" font-size="12" fill="#334155">scene + HUD passes</text>
<rect x="1310" y="355" width="220" height="70" rx="8" fill="#fce7f3" stroke="#94a3b8"/>
<text x="1322" y="377" font-size="15" font-weight="700" fill="#0f172a">AudioSystem / UiState</text>
<text x="1322" y="397" font-size="12" fill="#334155">SDL streams, overlay state;</text>
<text x="1322" y="413" font-size="12" fill="#334155">draw lists, no GL in ui</text>
<rect x="860" y="465" width="670" height="56" rx="8" fill="#e5e7eb" stroke="#94a3b8"/>
<text x="872" y="487" font-size="15" font-weight="700" fill="#0f172a">shared data</text>
<text x="872" y="507" font-size="12" fill="#334155">formats (no SDL/GL)   |   world math/geometry   |   ui layout rectangles</text>
<text x="860" y="545" font-size="11" fill="#0f172a" text-anchor="start" font-weight="400">rules: arrows go down only; no app includes in lower layers; no SDL/GL in formats/world/ui; every type has a test seam</text>
<rect x="860" y="570" width="670" height="58" rx="8" fill="#f1f5f9" stroke="#64748b"/>

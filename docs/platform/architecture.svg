<text x="872" y="612" font-size="12" fill="#334155">evidence-first formats, retail phase names, fast headless gate, policy + static guards</text>
<rect x="24" y="740" width="1552" height="300" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
<text x="42" y="770" font-size="18" font-weight="700" fill="#0f172a">C. Migration plan</text>
<text x="42" y="791" font-size="12" fill="#64748b">each slice is behaviour-preserving; gate = 376 fast / 518 full, selftest 194, screenshot parity</text>
<rect x="48" y="820" width="485" height="88" rx="8" fill="#ffffff" stroke="#94a3b8"/>
<text x="60" y="842" font-size="14" font-weight="700" fill="#0f172a">1. Guards (done)</text>
<text x="60" y="864" font-size="11" fill="#475569" text-anchor="start" font-weight="400">test_architecture.py: layer edges, no app in</text>
<text x="60" y="879" font-size="11" fill="#475569" text-anchor="start" font-weight="400">lower layers, Game method/member budget.</text>
<text x="60" y="900" font-size="10" fill="#166534" text-anchor="start" font-weight="600">gate: guards fail on an injected wrong edge</text>
<rect x="553" y="820" width="485" height="88" rx="8" fill="#ffffff" stroke="#94a3b8"/>
<text x="565" y="842" font-size="14" font-weight="700" fill="#0f172a">2. ParkSession (started)</text>
<text x="565" y="864" font-size="11" fill="#475569" text-anchor="start" font-weight="400">clock/budget/ledger moved;</text>
<text x="565" y="879" font-size="11" fill="#475569" text-anchor="start" font-weight="400">dinos/buildings next.</text>
<text x="565" y="900" font-size="10" fill="#166534" text-anchor="start" font-weight="600">gate: save/load + campaign tests unchanged</text>
<rect x="1058" y="820" width="485" height="88" rx="8" fill="#ffffff" stroke="#94a3b8"/>
<text x="1070" y="842" font-size="14" font-weight="700" fill="#0f172a">3. BuildController</text>
<text x="1070" y="864" font-size="11" fill="#475569" text-anchor="start" font-weight="400">fence/road/building/store validation,</text>
<text x="1070" y="879" font-size="11" fill="#475569" text-anchor="start" font-weight="400">cost and commit; keep draw data separate.</text>
<text x="1070" y="900" font-size="10" fill="#166534" text-anchor="start" font-weight="600">gate: placement/road/sell tests unchanged</text>
<rect x="48" y="920" width="485" height="88" rx="8" fill="#ffffff" stroke="#94a3b8"/>
<text x="60" y="942" font-size="14" font-weight="700" fill="#0f172a">4. FrameScheduler</text>
<text x="60" y="964" font-size="11" fill="#475569" text-anchor="start" font-weight="400">explicit retail task table from</text>
<text x="60" y="979" font-size="11" fill="#475569" text-anchor="start" font-weight="400">scheduler.md; Game::run calls it.</text>
<text x="60" y="1000" font-size="10" fill="#166534" text-anchor="start" font-weight="600">gate: phase-order test becomes task test</text>
<rect x="553" y="920" width="485" height="88" rx="8" fill="#ffffff" stroke="#94a3b8"/>
<text x="565" y="942" font-size="14" font-weight="700" fill="#0f172a">5. DinoSim/Animator</text>
<text x="565" y="964" font-size="11" fill="#475569" text-anchor="start" font-weight="400">mover + action events + clip sampling;</text>
<text x="565" y="979" font-size="11" fill="#475569" text-anchor="start" font-weight="400">this also closes P3-MOTION.</text>
<text x="565" y="1000" font-size="10" fill="#166534" text-anchor="start" font-weight="600">gate: dino/show/campaign tests unchanged</text>
<rect x="1058" y="920" width="485" height="88" rx="8" fill="#ffffff" stroke="#94a3b8"/>
<text x="1070" y="942" font-size="14" font-weight="700" fill="#0f172a">6. Renderer + shrink</text>
<text x="1070" y="964" font-size="11" fill="#475569" text-anchor="start" font-weight="400">GL RAII + hidden test mode; split</text>
<text x="1070" y="979" font-size="11" fill="#475569" text-anchor="start" font-weight="400">game.h into domain headers.</text>
<text x="1070" y="1000" font-size="10" fill="#166534" text-anchor="start" font-weight="600">gate: game.h &lt; 250 lines; clean build time down</text>

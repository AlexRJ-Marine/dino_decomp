<text x="872" y="397" font-size="12" fill="#334155">retail pan/yaw/zoom</text>
<text x="872" y="413" font-size="12" fill="#334155">orbit + free modes</text>
<rect x="1085" y="355" width="205" height="70" rx="8" fill="#fce7f3" stroke="#94a3b8"/>

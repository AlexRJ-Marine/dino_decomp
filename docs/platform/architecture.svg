<text x="580" y="320" font-size="10" fill="#475569" text-anchor="start" font-weight="400">core 21   boot 23   boot_park 11</text>
<text x="580" y="336" font-size="10" fill="#475569" text-anchor="start" font-weight="400">build 24   park 24   scene 22</text>
<text x="580" y="352" font-size="10" fill="#475569" text-anchor="start" font-weight="400">input 14   menu 8   show 10   ui 26</text>

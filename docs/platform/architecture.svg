<text x="830" y="120" font-size="18" font-weight="700" fill="#0f172a">B. Target: composition root + domain types</text>
<text x="830" y="141" font-size="12" fill="#64748b">one owner per concern; Game stops owning the park</text>
<rect x="860" y="155" width="670" height="58" rx="8" fill="#dbeafe" stroke="#94a3b8"/>

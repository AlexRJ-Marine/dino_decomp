<text x="592" y="172" font-size="15" font-weight="700" fill="#0f172a">Game</text>
<text x="592" y="192" font-size="12" fill="#334155">278 session members</text>
<text x="592" y="208" font-size="12" fill="#334155">171 methods</text>
<text x="592" y="224" font-size="12" fill="#334155">52 project includes</text>
<text x="592" y="240" font-size="12" fill="#334155">11 TUs include game.h</text>

<text x="872" y="197" font-size="12" fill="#334155">boot, platform, event loop, FrameScheduler, input mapping, IO; no park state</text>
<rect x="860" y="250" width="205" height="76" rx="8" fill="#ffedd5" stroke="#94a3b8"/>
<text x="872" y="272" font-size="15" font-weight="700" fill="#0f172a">ParkSession</text>

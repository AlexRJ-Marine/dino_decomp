<text x="580" y="380" font-size="11" fill="#166534" text-anchor="start" font-weight="600">ARCH-1: inversions removed</text>
<text x="580" y="396" font-size="10" fill="#166534" text-anchor="start" font-weight="400">formats/ini.* + formats/path.*</text>
<text x="580" y="412" font-size="10" fill="#166534" text-anchor="start" font-weight="400">guard: tests/test_architecture.py</text>
<text x="580" y="430" font-size="10" fill="#166534" text-anchor="start" font-weight="400">ARCH-2: + visitors moved</text>
<text x="70" y="612" font-size="12" fill="#0f172a" text-anchor="start" font-weight="600">include edges (count):</text>
<text x="70" y="632" font-size="11" fill="#475569" text-anchor="start" font-weight="400">app -> formats 56    app -> world 21    app -> render 7</text>
<text x="70" y="649" font-size="11" fill="#475569" text-anchor="start" font-weight="400">app -> ui 4    app -> audio 2</text>
<text x="70" y="666" font-size="11" fill="#475569" text-anchor="start" font-weight="400">world -> formats 30    render -> formats 12    ui -> formats 6</text>
<text x="70" y="683" font-size="11" fill="#475569" text-anchor="start" font-weight="400">audio -> formats 4    formats -> third_party 1 (allowed)</text>

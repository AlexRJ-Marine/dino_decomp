<rect width="1600" height="1080" fill="#f8fafc"/>
<text x="32" y="42" font-size="26" font-weight="700" fill="#0f172a">Dino Island port - architecture review</text>
<text x="32" y="68" font-size="14" fill="#475569">Current source dependencies (left), target composition (right), migration plan (bottom). Census 2026-10-29, after ARCH-1.</text>
